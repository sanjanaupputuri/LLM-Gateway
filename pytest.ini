[pytest]
# Use asyncio_mode=auto so async test functions are collected and run without
# needing @pytest.mark.asyncio on every function. Required by pytest-asyncio 0.24.x.
asyncio_mode = auto

# Set the default fixture loop scope explicitly to suppress pytest-asyncio deprecation warning.
# function scope means each async fixture/test gets its own event loop.
asyncio_default_fixture_loop_scope = function

# Test discovery
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Show short traceback for cleaner output; -v for verbose can be added per run
addopts = --tb=short -q
